name: 构建并发布 LSPosed 模块

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'module-meta/**'
      - 'signing/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'build.sh'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 私有签名构建与发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出目录源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 校验源码与私钥隔离
        shell: bash
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle.kts
          test -f build.sh
          if find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .; then
            echo '仓库中禁止包含签名密钥文件。'
            exit 1
          fi
          echo '目录源码结构与私钥隔离检查通过。'

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          if ! "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37' 'build-tools;36.0.0'
          fi

      - name: 恢复私有 PKCS12 签名
        id: signing
        shell: bash
        env:
          HYPERBG_KEYSTORE_BASE64: ${{ secrets.HYPERBG_KEYSTORE_BASE64 }}
          HYPERBG_KEYSTORE_PASSWORD: ${{ secrets.HYPERBG_KEYSTORE_PASSWORD }}
          HYPERBG_KEY_ALIAS: ${{ secrets.HYPERBG_KEY_ALIAS }}
        run: |
          test -n "$HYPERBG_KEYSTORE_BASE64"
          test -n "$HYPERBG_KEYSTORE_PASSWORD"
          test -n "$HYPERBG_KEY_ALIAS"
          SIGNING_DIR="$RUNNER_TEMP/hyperbackground-signing"
          mkdir -p "$SIGNING_DIR"
          KEYSTORE="$SIGNING_DIR/hyperbackground-release.p12"
          printf '%s' "$HYPERBG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE" -storepass "$HYPERBG_KEYSTORE_PASSWORD" -alias "$HYPERBG_KEY_ALIAS" >/dev/null
          echo "path=$KEYSTORE" >> "$GITHUB_OUTPUT"

      - name: 构建 Release APK
        shell: bash
        env:
          JAVA_RUNTIME: ${{ env.JAVA_HOME }}
          HYPERBG_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          HYPERBG_KEYSTORE_PASSWORD: ${{ secrets.HYPERBG_KEYSTORE_PASSWORD }}
          HYPERBG_KEY_ALIAS: ${{ secrets.HYPERBG_KEY_ALIAS }}
          HYPERBG_KEY_PASSWORD: ${{ secrets.HYPERBG_KEY_PASSWORD }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 校验版本、作用域与私有签名
        id: package
        shell: bash
        run: |
          EXPECTED='A1:75:5A:BE:D4:13:5A:38:17:B0:D8:76:0F:40:BE:A5:D3:B7:00:1B:08:A8:29:EA:1D:3C:DA:90:FB:D4:4F:4B'
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          APK="$(find dist -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          VERSION="$("$BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_CODE="$("$BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          RAW="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          ACTUAL="$(printf '%s' "$RAW" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')"
          test "$ACTUAL" = "$EXPECTED"
          unzip -p "$APK" META-INF/xposed/scope.list > "$RUNNER_TEMP/scope.list"
          test "$(wc -l < "$RUNNER_TEMP/scope.list")" -eq 8
          for package_name in \
            com.android.settings com.milink.service com.android.phone com.xiaomi.account \
            com.android.thememanager com.miui.home com.miui.securitycenter com.miui.powerkeeper; do
            grep -Fxq "$package_name" "$RUNNER_TEMP/scope.list"
          done
          TARGET="HyperBackground-v$VERSION.apk"
          cp "$APK" "$TARGET"
          SHA256="$(sha256sum "$TARGET" | awk '{print $1}')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "certificate=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: 上传 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: HyperBackground-v${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.apk }}
          if-no-files-found: error

      - name: 生成发行说明
        id: release_notes
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
          VERSION_CODE: ${{ steps.package.outputs.version_code }}
          APK_NAME: ${{ steps.package.outputs.apk }}
          APK_SHA256: ${{ steps.package.outputs.sha256 }}
          CERTIFICATE: ${{ steps.package.outputs.certificate }}
        run: |
          LOWER="${VERSION,,}"
          if [[ "$LOWER" =~ (test|alpha|beta|rc|dev) ]]; then
            PRERELEASE=true
            MAKE_LATEST=false
          else
            PRERELEASE=false
            MAKE_LATEST=true
          fi
          CHANGELOG_SECTION="$(awk -v target="$VERSION" '
            $0 == "## " target { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          NOTES_PATH="$RUNNER_TEMP/hyperbackground-release-notes.md"
          {
            echo "# HyperBackground v$VERSION"
            echo
            if [[ "$PRERELEASE" == true ]]; then
              echo "> 测试版提示：该版本用于验证兼容性，可能存在 Hook 失效、界面异常或闪退；请保留上一正式版安装包。"
              echo
            fi
            if [[ -n "$CHANGELOG_SECTION" ]]; then
              printf '%s\n' "$CHANGELOG_SECTION"
              echo
            fi
            if [[ "$VERSION" == '1.3.6' ]]; then
              echo "> 签名迁移：1.3.6 起改用固定私有签名，无法直接覆盖 1.3.5 及更早公开签名版本。请先备份配置并卸载旧版。"
              echo
            fi
            echo "## 构建链"
            echo
            echo "- main：目录源码 → Java 17 → Android SDK 37 / Build Tools 36.0.0 → Gradle Release → Secrets 注入 PKCS12 私有签名 → 版本、作用域与证书校验 → Actions Artifact → GitHub Release。"
            echo "- source-archives：历史源码 ZIP 独立分支，构建链按版本号选择最高归档；1.3.6 本次从 main 目录源码构建。"
            echo
            echo "## 构建信息"
            echo
            echo "- versionName：$VERSION"
            echo "- versionCode：$VERSION_CODE"
            echo "- APK：$APK_NAME"
            echo "- SHA-256：$APK_SHA256"
            echo "- 证书 SHA-256：$CERTIFICATE"
            echo "- 构建提交：$GITHUB_SHA"
          } > "$NOTES_PATH"
          echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"

      - name: 发布到 GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          APK_NAME: ${{ steps.package.outputs.apk }}
          NOTES_PATH: ${{ steps.release_notes.outputs.path }}
          PRERELEASE: ${{ steps.release_notes.outputs.prerelease }}
          MAKE_LATEST: ${{ steps.release_notes.outputs.make_latest }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.id')"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f name="HyperBackground v$VERSION" \
              -F "body=@$NOTES_PATH" \
              -F prerelease="$PRERELEASE" \
              -f make_latest="$MAKE_LATEST" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="HyperBackground v$VERSION" \
              -F "body=@$NOTES_PATH" \
              -F prerelease="$PRERELEASE" \
              -f make_latest="$MAKE_LATEST" >/dev/null
          fi
          gh release upload "$TAG" "$APK_NAME" --clobber

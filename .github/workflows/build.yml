name: 构建 LSPosed 模块

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 构建 HyperBackground
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 载入模块源码
        shell: bash
        run: |
          test -f source-bundle.zip
          unzip -o source-bundle.zip
          test -f app/src/main/AndroidManifest.xml
          test -f build.sh

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1"

      - name: 恢复固定发布签名
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "未配置固定发布签名 RELEASE_KEYSTORE_BASE64，拒绝生成不同签名的 APK。"
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > signing/hyperbackground-release.jks

      - name: 构建 LSPosed 模块 APK
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ github.workspace }}/signing/hyperbackground-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 校验发布签名
        shell: bash
        run: |
          EXPECTED="8C:79:74:AD:4C:33:97:FB:23:11:F6:B4:E4:7B:F8:93:63:06:DB:F2:B7:97:C2:20:80:66:ED:F4:15:EC:40:A9"
          RAW="$($ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner verify --print-certs dist/HyperBackground-v1.1.0.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          ACTUAL="$(printf '%s' "$RAW" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')"
          echo "期望指纹：$EXPECTED"
          echo "实际指纹：$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperBackground-v1.1.0
          path: dist/HyperBackground-v1.1.0.apk
          if-no-files-found: error

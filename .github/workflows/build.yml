name: 构建 LSPosed 模块

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 构建 HyperBackground 1.1.1
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 校验并解压 1.1.1 源码
        shell: bash
        run: |
          test -f HyperBackground-v1.1.1-source.zip
          unzip -t HyperBackground-v1.1.1-source.zip
          rm -rf HyperBackground
          unzip -o HyperBackground-v1.1.1-source.zip
          test -f HyperBackground/app/src/main/AndroidManifest.xml
          test -f HyperBackground/build.sh
          test -f HyperBackground/signing/hyperbackground-debug.jks

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 组件
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1"

      - name: 构建 LSPosed 模块 APK
        shell: bash
        working-directory: HyperBackground
        env:
          JAVA_RUNTIME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 校验发布签名
        shell: bash
        run: |
          EXPECTED="8C:79:74:AD:4C:33:97:FB:23:11:F6:B4:E4:7B:F8:93:63:06:DB:F2:B7:97:C2:20:80:66:ED:F4:15:EC:40:A9"
          APK="$(find HyperBackground/dist -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          RAW="$($ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          ACTUAL="$(printf '%s' "$RAW" | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')"
          echo "期望指纹：$EXPECTED"
          echo "实际指纹：$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          cp "$APK" HyperBackground/dist/HyperBackground-v1.1.1.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperBackground-v1.1.1
          path: HyperBackground/dist/HyperBackground-v1.1.1.apk
          if-no-files-found: error

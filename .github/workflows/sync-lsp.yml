name: 同步到 LSPosed 官方仓库

on:
  workflow_run:
    workflows: ["构建并发布 LSPosed 模块"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: 同步源码与 Release
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-latest
    env:
      LSP_REPO: Xposed-Modules-Repo/com.ciallo.hyperbackground

    steps:
      - name: 检出对应源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: 读取版本信息
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          test -n "$VERSION_CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "source_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "lsp_tag=$VERSION_CODE-$VERSION" >> "$GITHUB_OUTPUT"

      - name: 同步 main 源码到 LSPosed 仓库
        shell: bash
        env:
          LSP_REPO_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
        run: |
          test -n "$LSP_REPO_TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git remote remove lsp 2>/dev/null || true
          git remote add lsp "https://x-access-token:${LSP_REPO_TOKEN}@github.com/${LSP_REPO}.git"
          git push lsp HEAD:main

      - name: 等待主仓库 Release 可读取
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.version.outputs.source_tag }}
        run: |
          for i in {1..12}; do
            if gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "未找到主仓库 Release: $SOURCE_TAG"
          exit 1

      - name: 下载主仓库 Release APK 与说明
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.version.outputs.source_tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/lsp-release"
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' \
            --dir "$RUNNER_TEMP/lsp-release"
          gh release view "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body' > "$RUNNER_TEMP/lsp-release/notes.md"
          test -n "$(find "$RUNNER_TEMP/lsp-release" -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: 创建或更新 LSPosed Release
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          LSP_TAG: ${{ steps.version.outputs.lsp_tag }}
        run: |
          test -n "$GH_TOKEN"
          NOTES="$RUNNER_TEMP/lsp-release/notes.md"
          APK="$(find "$RUNNER_TEMP/lsp-release" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          LOWER="${VERSION,,}"
          if [[ "$LOWER" =~ (test|alpha|beta|rc|dev) ]]; then
            PRERELEASE=true
            MAKE_LATEST=false
          else
            PRERELEASE=false
            MAKE_LATEST=true
          fi

          if gh release view "$LSP_TAG" --repo "$LSP_REPO" >/dev/null 2>&1; then
            RELEASE_ID="$(gh api "repos/$LSP_REPO/releases/tags/$LSP_TAG" --jq '.id')"
            gh api --method PATCH "repos/$LSP_REPO/releases/$RELEASE_ID" \
              -f name="$VERSION" \
              -F "body=@$NOTES" \
              -F prerelease="$PRERELEASE" \
              -f make_latest="$MAKE_LATEST" >/dev/null
          else
            gh api --method POST "repos/$LSP_REPO/releases" \
              -f tag_name="$LSP_TAG" \
              -f target_commitish="main" \
              -f name="$VERSION" \
              -F "body=@$NOTES" \
              -F prerelease="$PRERELEASE" \
              -f make_latest="$MAKE_LATEST" >/dev/null
          fi

          gh release upload "$LSP_TAG" "$APK" --repo "$LSP_REPO" --clobber

      - name: 完成
        shell: bash
        run: |
          echo "源码已同步到 $LSP_REPO"
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "Release 已同步：${{ steps.version.outputs.lsp_tag }}"
          fi
